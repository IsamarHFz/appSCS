name: app_scs
description: "A new Flutter project."
publish_to: 'none'

# while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.18.1
  cupertino_icons: ^1.0.8
  image_picker: ^0.8.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1 # Asegúrate de incluir esto si vas a usar el plugin

flutter_icons: # Este bloque debe estar como "flutter_icons", no "flutter_launcher_icons"
  android: "launcher_icon"
  ios: true
  image_path: "imagenes/logo.png"
  adaptive_icon_background: imagenes/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - imagenes/
